name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt . pyinstaller

      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onedir --windowed
          --name RoadRageTrip --paths src
          --hidden-import pygame
          --collect-submodules pygame
          --collect-binaries pygame
          --collect-data pygame
          --collect-all pygame
          --icon "src/theroadragetrip/assets/roadragetrip_icon.ico"
          --add-data "sample_osm.json;."
          --add-data "sample_osm_large.json;."
          --add-data "src/theroadragetrip/img;theroadragetrip/img"
          --add-data "src/theroadragetrip/sounds;theroadragetrip/sounds"
          --add-data "src/theroadragetrip/assets;theroadragetrip/assets"
          road_rage_trip.py

      - name: Package release
        run: |
          Compress-Archive -Path dist/RoadRageTrip/* -DestinationPath dist/RoadRageTrip-windows-x64.zip
          choco install innosetup --no-progress --yes
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer/RoadRageTrip.iss

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/RoadRageTrip-windows-x64.zip dist/RoadRageTrip-Setup.exe
          --generate-notes