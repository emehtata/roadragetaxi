[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theroadragetrip"
# 0.21.0beta (Godot client + Python server), in PEP 440 form.
version = "0.21.0b0"
description = "PoC top-down driving game using OSM data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "ephem>=4.2.1,<5",  # the planet sky was validated against 4.2.1 (docs/planet-sky.md)
    "rsplan",
    "pyproj",
    "shapely",
    "paho-mqtt>=2.1",
    "opening-hours-py>=2.1,<3",
]

[project.optional-dependencies]
windows = ["pyinstaller"]

[project.scripts]
roadragetrip-server = "theroadragetrip.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theroadragetrip = [
    "assets/**/*",  # recursive: audio/, railway_announcements/... (assets/* missed every subfolder)
    "img/*",
    "sounds/*",
    "sounds/passenger_chatter/*.ogg",
    "sounds/driver_chatter/*.ogg",
]
