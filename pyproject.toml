[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theroadragetrip"
# 0.17.1alpha (Godot client + Python server), in PEP 440 form.
version = "0.17.1a0"
description = "PoC top-down driving game using OSM data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pyproj",
    "shapely",
]

[project.optional-dependencies]
windows = ["pyinstaller"]

[project.scripts]
roadragetrip-server = "theroadragetrip.server.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theroadragetrip = [
    "assets/**/*",  # recursive: audio/, railway_announcements/... (assets/* missed every subfolder)
    "img/*",
    "sounds/*",
    "sounds/passenger_chatter/*.ogg",
    "sounds/driver_chatter/*.ogg",
]
