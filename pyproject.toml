[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theroadragetrip"
# 0.16.0g-alpha (the Godot client experiment), in PEP 440 form - pip rejects "0.16.0g-alpha".
version = "0.16.0a0+g"
description = "PoC top-down driving game using OSM data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pygame-ce",
    "requests",
    "pyproj",
    "shapely",
]

[project.optional-dependencies]
windows = ["pyinstaller"]

[project.scripts]
roadragetrip = "theroadragetrip.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
theroadragetrip = [
    "assets/**/*",  # recursive: audio/, railway_announcements/... (assets/* missed every subfolder)
    "img/*",
    "sounds/*",
    "sounds/passenger_chatter/*.wav",
    "sounds/driver_chatter/*.wav",
]
